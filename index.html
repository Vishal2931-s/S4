<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAEC Student Portal</title>

<style>

/* ===== GLOBAL ===== */
body{
margin:0;
font-family:'Segoe UI',sans-serif;
overflow:hidden;
}

/* ===== PORTAL HEADER ===== */
.header{
background:#002147;
color:white;
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.subheader{
background:#003366;
color:white;
padding:8px;
text-align:center;
font-size:14px;
}

/* ===== LOGIN PAGE ===== */
#loginPage{
height:100vh;
background:#f1f5f9;
display:flex;
flex-direction:column;
}

.login-container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
background:white;
padding:35px;
width:90%;
max-width:350px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
border-radius:8px;
text-align:center;
}

.login-box h2{
margin-bottom:20px;
color:#002147;
}

.login-box input{
width:90%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

.login-box button{
background:#002147;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
width:95%;
}

/* ===== LOADING ===== */
#loadingScreen{
display:none;
height:100vh;
background:white;
justify-content:center;
align-items:center;
flex-direction:column;
}

.loader{
border:6px solid #f3f3f3;
border-top:6px solid #002147;
border-radius:50%;
width:50px;
height:50px;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

/* ===== ROSE SCREEN ===== */
#roseScreen{
display:none;
background:white;
height:100vh;
position:relative;
overflow:hidden;
}

.rose{
position:absolute;
font-size:28px;
animation:fall linear forwards;
}

@keyframes fall{
from{transform:translateY(-50px);}
to{transform:translateY(100vh);}
}

#heartButton{
display:none;
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
background:red;
color:white;
padding:15px 25px;
border:none;
border-radius:40px;
font-size:20px;
cursor:pointer;
box-shadow:0 0 15px red;
}

/* ===== FINAL PAGE ===== */
#finalPage{
display:none;
height:100vh;
background:linear-gradient(to top,#ff758c,#ff7eb3);
text-align:center;
padding-top:40px;
color:white;
position:relative;
overflow:hidden;
}

.glowText{
font-size:35px;
font-family:cursive;
text-shadow:0 0 10px white,0 0 20px pink,0 0 40px red;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px white;}
to{text-shadow:0 0 30px red;}
}

/* POLAROID */
.polaroid{
display:inline-block;
background:white;
padding:10px;
margin:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.5);
border-radius:8px;
}

.polaroid img{
width:150px;
height:200px;
object-fit:cover;
}

/* FIREWORKS */
.firework{
position:absolute;
font-size:20px;
animation:explode 1.5s ease-out forwards;
}

@keyframes explode{
0%{transform:scale(0);}
100%{transform:scale(2);opacity:0;}
}

@media(max-width:600px){
.glowText{font-size:28px;}
.polaroid img{width:110px;height:150px;}
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
<div class="header">SAEC Engineering College</div>
<div class="subheader">Student Login Portal</div>

<div class="login-container">
<div class="login-box">
<h2>Student Login</h2>
<input type="text" placeholder="Register Number"><br>
<input type="date"><br>
<button onclick="startLoading()">Login</button>
</div>
</div>
</div>

<!-- LOADING -->
<div id="loadingScreen">
<div class="loader"></div>
<p>Authenticating...</p>
</div>

<!-- ROSES -->
<div id="roseScreen">
<button id="heartButton" onclick="openLove()">❤️ Tap to Open</button>
</div>

<!-- FINAL -->
<div id="finalPage">
<h1 class="glowText" id="typing"></h1>
<h2 class="glowText">I Love You So Much 💖</h2>

<div>
<div class="polaroid"><img src="Snapchat-797614704.jpg"></div>
<div class="polaroid"><img src="Snapchat-1732831707.jpg"></div>
<div class="polaroid"><img src="Snapchat-28026532.jpg"></div>
</div>
</div>

<audio id="music" src="Annul-Maelae-MassTamilan.com.mp3"></audio>

<script>

function startLoading(){
document.getElementById("loginPage").style.display="none";
document.getElementById("loadingScreen").style.display="flex";

setTimeout(()=>{
document.getElementById("loadingScreen").style.display="none";
startRoses();
},2500);
}

function startRoses(){
let roseScreen=document.getElementById("roseScreen");
roseScreen.style.display="block";
document.getElementById("music").play();

let count=0;

let interval=setInterval(()=>{

let rose=document.createElement("div");
rose.innerHTML="🌹";
rose.style.position="absolute";
rose.style.left=Math.random()*100+"vw";
rose.style.top="-40px";
rose.style.fontSize="28px";
rose.style.transition="top 3s linear";

roseScreen.appendChild(rose);

setTimeout(()=>{
let finalPosition = Math.random() * (window.innerHeight - 80);
rose.style.top = finalPosition + "px";
},50);

count++;

if(count>120){
clearInterval(interval);
document.getElementById("heartButton").style.display="block";
}

},80);
}

function openLove(){
document.getElementById("roseScreen").style.display="none";
document.getElementById("finalPage").style.display="block";

typeEffect();
fireworks();
}

function typeEffect(){
let text="Happy Valentine's Day My Love ❤️";
let i=0;
let speed=80;
function typing(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(typing,speed);
}
}
typing();
}

function fireworks(){
for(let i=0;i<50;i++){
let fw=document.createElement("div");
fw.classList.add("firework");
fw.innerHTML="🎆";
fw.style.left=Math.random()*100+"vw";
fw.style.top=Math.random()*100+"vh";
document.body.appendChild(fw);
setTimeout(()=>fw.remove(),1500);
}
}

</script>

</body>
</html>
